name: Dynamic Quickstart Execution & Chart Generation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-quickstart:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Crucial to allow github-actions[bot] to push the updated chart

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas matplotlib pytest

    - name: Run Unit Tests
      run: |
        python -m pytest tests/

    - name: Execute Quickstart Script
      run: |
        python example_quickstart.py

    - name: Commit and Push Dynamic Chart
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add quickstart_performance.png
        git diff-index --quiet HEAD || git commit -m "Auto-update dynamic quickstart performance chart [skip ci]"
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
